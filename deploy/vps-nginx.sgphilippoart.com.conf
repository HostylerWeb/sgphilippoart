# Production vhost for sgphilippoart.com (app: /var/www/sites/sgphilippoart, port 3001)
# Requires upstream sgphilippoart_app and limit_req zone from sgphilippoart.staging
# Install:
#   cp deploy/vps-nginx.sgphilippoart.com.conf /etc/nginx/sites-available/sgphilippoart.com
#   ln -sf /etc/nginx/sites-available/sgphilippoart.com /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d sgphilippoart.com -d www.sgphilippoart.com

server {
    server_name sgphilippoart.com www.sgphilippoart.com;

    client_max_body_size 150M;
    client_body_timeout 600s;

    location /uploads/ {
        alias /var/www/sites/sgphilippoart/public/uploads/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    location / {
        limit_req zone=sgphilippoart_general burst=40 nodelay;
        proxy_pass http://sgphilippoart_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        # Product form: large uploads + ffmpeg WebM conversion (can take several minutes).
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/sgphilippoart.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sgphilippoart.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = www.sgphilippoart.com) {
        return 301 https://$host$request_uri;
    }

    if ($host = sgphilippoart.com) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    listen [::]:80;
    server_name sgphilippoart.com www.sgphilippoart.com;
    return 404;
}
