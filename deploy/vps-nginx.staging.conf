# Staging: SG Philippo Art on the VPS hostname (before sgphilippoart.com DNS cutover)
# Install: /etc/nginx/sites-available/sgphilippoart.staging
# Enable:  ln -s ... /etc/nginx/sites-enabled/
#
# IMPORTANT: Remove srv1872514.hstgr.cloud from hostyler.com server_name
# so this hostname routes to port 3001, not Hostyler (3000).

limit_req_zone $binary_remote_addr zone=sgphilippoart_general:10m rate=10r/s;

upstream sgphilippoart_app {
    server 127.0.0.1:3001;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name srv1872514.hstgr.cloud;

    client_max_body_size 20M;

    location / {
        limit_req zone=sgphilippoart_general burst=40 nodelay;
        proxy_pass http://sgphilippoart_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}

# After DNS for sgphilippoart.com points here, add a second server block or
# extend server_name and run: certbot --nginx -d sgphilippoart.com -d www.sgphilippoart.com
